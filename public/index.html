<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ChatGPT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="welcome-screen" id="welcomeScreen">
      <div class="welcome-logo">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.86-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.51 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.738 20.95a4.5 4.5 0 0 1-6.137-2.646zM2.34 7.896a4.485 4.485 0 0 1 2.348-2.032V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855-5.833-3.387L15.119 7.2a.071.071 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.738a.79.79 0 0 0-.407-.607zm2.02-4.91-2.02-1.164a.776.776 0 0 0-.785 0L12.34 9.038V6.702a.066.066 0 0 1 .033-.061l4.83-2.782a4.5 4.5 0 0 1 6.657 4.076v.024c-.005.132-.014.263-.029.393zM8.308 12.869l-2.02-1.164a.08.08 0 0 1-.038-.057V6.092a4.5 4.5 0 0 1 7.431-3.453l-.142.08L8.768 5.466a.795.795 0 0 0-.39.676v6.727zm1.976-2.987 1.747-1.007 1.752 1.007v2.027l-1.752 1.012-1.747-1.012z"/>
        </svg>
      </div>
      <h2>欢迎使用 ChatGPT</h2>
      <p class="welcome-desc">请输入你的昵称开始对话</p>
      <div class="nickname-input-wrapper">
        <input
          type="text"
          id="nicknameInput"
          class="nickname-input"
          placeholder="请输入昵称"
          maxlength="20"
          autocomplete="off"
        />
        <button id="startBtn" class="start-btn">开始对话</button>
      </div>
      <p class="welcome-tip">昵称会保存在本地，下次自动登录</p>
    </div>

    <div class="chat-screen" id="chatScreen" style="display: none;">
      <header class="header">
        <button class="menu-btn" id="menuBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="header-title">
          <h1>ChatGPT</h1>
          <span class="model-label" id="modelLabel">GPT-4o mini</span>
        </div>
        <button class="avatar-btn">
          <div class="user-avatar">U</div>
        </button>
      </header>

      <main class="chat-container" id="chatContainer">
        <div class="welcome">
          <div class="welcome-logo-chat">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073z"/>
            </svg>
          </div>
          <h2>有什么可以帮你的？</h2>
        </div>
        <div id="messages"></div>
        <div class="thinking-indicator" id="thinkingIndicator" style="display: none;">
          <div class="thinking-avatar">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073z"/>
            </svg>
          </div>
          <div class="thinking-content">
            <span class="thinking-text">正在思考</span>
            <span class="thinking-dots">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </div>
        </div>
      </main>

      <footer class="input-area">
        <div class="input-wrapper">
          <button class="attach-btn" id="attachBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <input type="file" id="imageInput" accept="image/*" style="display: none;">
          <textarea
            id="messageInput"
            placeholder="给 ChatGPT 发送消息"
            rows="1"
            autocomplete="off"
          ></textarea>
          <button id="sendBtn" class="send-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="disclaimer">ChatGPT 也可能犯错。请核查重要信息。</p>
      </footer>
    </div>

    <div class="side-menu" id="sideMenu">
      <div class="menu-mask" id="menuMask"></div>
      <div class="menu-panel">
        <div class="menu-header">
          <div class="menu-user-info">
            <div class="menu-avatar">U</div>
            <div class="menu-nickname" id="menuNickname">用户</div>
          </div>
        </div>
        <button class="new-chat-btn" id="newChatBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          新建对话
        </button>
        <div class="conversation-list" id="conversationList"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
